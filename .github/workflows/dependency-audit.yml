name: Dependency audit

# Weekly dependency audit per docs/dependency-audit.md. WARN findings need a
# review decision. FAIL items (unknown or unreachable external script,
# missing action repository) fail the run. Mondays 09:00 UTC, manual runs.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run dependency audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/dependency-audit.sh
